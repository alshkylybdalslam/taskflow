name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test · Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test

      - name: Run coverage
        if: matrix.node-version == '18.x'
        run: npm run coverage

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t taskflow:ci .

      - name: Smoke test — seed on boot, server up, runs as non-root
        run: |
          docker run -d --name tf -p 3000:3000 taskflow:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/docs.json > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/docs.json | grep -q '"TaskFlow API"'
          test "$(docker exec tf id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs tf || true

      - name: Cleanup
        if: always()
        run: docker rm -f tf || true
